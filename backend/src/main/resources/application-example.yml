spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/interview_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: interview_app
    password: 여기에_본인_DB_비밀번호
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    secret: "local-dev-only-change-this-secret-key-please-32bytes-min"
    expiration-ms: 86400000
  # openai 또는 bedrock. 생략하면 openai가 기본값.
  ai:
    provider: openai
  # LiteLLM Gateway(OpenAI 호환) 연결 정보. 키/주소는 파일에 적지 않고 환경변수로만 넣는다.
  # LLM_BASE_URL은 "/v1"까지 포함한 주소여야 한다 (예: https://<gateway-host>/v1).
  openai:
    base-url: ${LLM_BASE_URL}
    api-key: ${LLM_API_KEY}
    model: "bedrock-sonnet"
  aws:
    # provider: bedrock 일 때만 사용됨. 자격증명은 여기 넣지 않는다 -
    # AWS SDK Default Credentials Provider Chain(환경변수/~/.aws/credentials/
    # EC2 인스턴스 프로파일 등)이 알아서 찾아서 쓴다.
    bedrock:
      region: us-east-1
      # 학교 AWS 환경은 us. 접두사가 붙은 cross-region inference profile ID를 씀
      model-id: "us.anthropic.claude-3-haiku-20240307-v1:0"
  storage:
    local-dir: ./uploads
