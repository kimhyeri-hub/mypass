spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/interview_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: interview_app
    password: 여기에_본인_DB_비밀번호
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

server:
  port: 8080

app:
  jwt:
    secret: "local-dev-only-change-this-secret-key-please-32bytes-min"
    expiration-ms: 86400000
  # openai 또는 bedrock. 생략하면 openai가 기본값.
  ai:
    provider: bedrock
  openai:
    api-key: "여기에_본인_OpenAI_API_키"
    model: "gpt-4o-mini"
  aws:
    # provider: bedrock 일 때만 사용됨. 자격증명은 여기 넣지 않는다 -
    # AWS SDK Default Credentials Provider Chain(환경변수/~/.aws/credentials/
    # EC2 인스턴스 프로파일 등)이 알아서 찾아서 쓴다.
    bedrock:
      region: us-east-1
      # 학교 AWS 환경은 us. 접두사가 붙은 cross-region inference profile ID를 씀
      model-id: "us.anthropic.claude-3-haiku-20240307-v1:0"
  storage:
    local-dir: ./uploads
